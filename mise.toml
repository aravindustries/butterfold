[tools]
uv = "latest"
# rust = "latest"
# "pipx:fusesoc" = "latest"

[settings]
python.uv_venv_auto = "create|source"

[env]
# Vivado
_.source = '''
{%- if os() == 'linux' -%}
{{ env.TOOLS_HOME }}/xilinx/2025.1/Vivado/settings64.sh
{%- endif -%}
'''
XSIM_COLOR = 1

GH_PROMPT_DISABLED = 1

PROJECT_ROOT_DIR = "{{ config_root }}"
PROJECT_NAME     = "{{ config_root | split(pat='/') | last }}"

RTL_DIR  = "{{ env.PROJECT_ROOT_DIR }}/rtl"
SIM_DIR  = "{{ env.PROJECT_ROOT_DIR }}/sim"
SYN_DIR  = "{{ env.PROJECT_ROOT_DIR }}/syn"
WORK_DIR = "{{ env.PROJECT_ROOT_DIR }}/work"

GOTO_ENV_DIR = '''
{%- if os() in ['linux', 'macos'] -%}
{{ env.PROJECT_ROOT_DIR }}
{%- endif -%}
'''

[tasks.sync]
description = "Sync repo state: pull, submodules, tool install, python env"
run = """
git pull
git submodule update --init --recursive
mise trust && mise install
uv sync --locked
"""

[tasks.setup]
hide = true
description = "Run immediately after clone/branch"
depends = ["sync"]
run = """
mkdir -p $WORK_DIR/tools/verilator
vivado -mode batch -notrace -source "$WORK_DIR/tools/vivado/subscripts/create_project.vivado.tcl"
"""

[tasks."zellij:dev-session"]
description = "Launch Zellij workspace & project directory"
run = """
{% if os() in ['linux', 'macos'] -%}
open $PROJECT_ROOT_DIR
{% endif %}
zellij delete-session $PROJECT_NAME >/dev/null 2>&1 || true
zellij --layout=$PROJECT_ROOT_DIR/zellij_layout.kdl attach --create $PROJECT_NAME
"""

[tasks."vivado:launch"]
dir = "{{ env.WORK_DIR }}/tools/vivado/{{ env.PROJECT_NAME }}"
run = "nohup vivado -mode gui -notrace -source $WORK_DIR/tools/vivado/subscripts/init.vivado.tcl > /dev/null 2>&1 &"

[tasks."vivado:lint"]
hide = true
dir = "{{ env.WORK_DIR }}/tools/vivado/{{ env.PROJECT_NAME }}"
# run the vivado linter & paste output here

[tasks."vivado:simulate"]
dir = "{{ env.WORK_DIR }}/tools/vivado/{{ env.PROJECT_NAME }}"
usage = '''
arg "<duration>" help="Max sim time (e.g. '1ns'); omit or 0 for run-all" default="all"
'''
run = """
clear
vivado -mode batch -notrace -source $WORK_DIR/tools/vivado/subscripts/run_sim.vivado.tcl -tclargs "$usage_duration"
"""
# FUTURE: if time units ARE specified, open in tcl mode to allow for time stepping, else stick to batch mode

[tasks."vivado:generate-bitstream"]
hide = true
# run optimise-area (or use the previous run) & gen bitstream file & open hardware manager

[tasks."verilator:sim"]
description = "PoC loop: build & run a Verilator sim — pass the top module first, then any number of files (raw = stream output live, tee keeps the log)"
raw = true
usage = '''
arg "<top>" help="Top module name, e.g. tb_counter"
arg "<files...>" help="All design/testbench files (full filenames with .sv), e.g. rtl/src/counter.sv tb_counter.sv"
'''
run = """
set -e
verilator --binary -j 0 -Wall -Wno-fatal --timing --top-module "$usage_top" --Mdir "$WORK_DIR/tools/verilator/sim" $usage_files -o sim 2>&1 | tee "$WORK_DIR/tools/verilator/sim.build.log"
"$WORK_DIR/tools/verilator/sim/sim" +verilator+seed+1 2>&1 | tee "$WORK_DIR/tools/verilator/sim.sim.log"
"""

[tasks."docker:librelane"]
description = "Start the gf180 Docker container, then attach a shell or serve JupyterLab"
usage = '''
arg "<target>" help="'shell' attaches a shell (default), 'jupyter' serves JupyterLab" default="shell" {
  choices "shell" "jupyter"
}
'''
env = { CONTAINER_NAME = "gf180", DOCKER_TAG = "chipathon26", DESIGNS = "{{ env.PROJECT_ROOT_DIR }}" }
run = '''
if [ -z "$(docker ps -q -f name=^/$CONTAINER_NAME$)" ]; then
    bash "$WORK_DIR/tools/librelane/sscs-chipathon-2026/resources/IIC-OSIC-TOOLS/start_chipathon_vnc.sh"
    docker exec -u 0 "$CONTAINER_NAME" sh -c '
        rm -f /etc/group.lock /etc/gshadow.lock
        getent group hostgroup >/dev/null 2>&1 || groupadd -g 1000 hostgroup' || true
fi
case "${usage_target}" in
shell)
    docker exec -it "$CONTAINER_NAME" bash -cl '
        source sak-pdk-script.sh gf180mcuD gf180mcu_fd_sc_mcu7t5v0
        librelane --version
        exec bash'
    ;;
jupyter)
    port=8888
    nb="librelane.ipynb"  # relative to the repo root (/foss/designs)
    up() { curl -s -m 2 -o /dev/null "http://localhost:$port/api/status"; }

    if ! up; then
        docker exec "$CONTAINER_NAME" bash -c 'pkill -9 -f "[j]upyter-lab"' >/dev/null 2>&1 || true
        for _ in $(seq 1 20); do up || break; sleep 0.5; done     # wait for :$port to stop answering
        docker exec -d "$CONTAINER_NAME" bash -cl "exec jupyter lab --no-browser --port=$port /foss/designs/$nb > /tmp/jupyter.log 2>&1"
        for _ in $(seq 1 40); do up && break; sleep 0.5; done     # wait for it to come up
    fi

    xdg-open "http://localhost:$port/lab/tree/$nb" >/dev/null 2>&1 &
    # stop: docker exec $CONTAINER_NAME pkill -9 -f jupyter-lab
    # log:  docker exec $CONTAINER_NAME tail -f /tmp/jupyter.log
    ;;
esac
'''

