# GF180MCU LibreLane config for ButterFold.
# Mirrors the working /foss/designs/01_rtl2gds_counter/config.yaml (which routes
# cleanly to GDS on GF180); only the design-specific fields are changed.

meta:
  version: 3
  flow: Classic

DESIGN_NAME: butterfold_top
VERILOG_FILES:
  - dir::../generated/rtl/butterfold_top.v
CLOCK_PORT: clk
CLOCK_PERIOD: 50

# Die area: 700x700 um absolute. ButterFold is ~900 flip-flops + one shared 24x12
# complex multiplier + twiddle/index ROMs, so it needs much more room than the
# 4-flop counter (300x300). Generous area keeps routing easy; bump up if placement
# reports congestion, or down if you want a tighter area number.
FP_SIZING: absolute
DIE_AREA: [0.0, 0.0, 700.0, 700.0]

# Don't treat lint-level synth warnings as fatal. The 69 "checks" here are all
# memory-inference artifacts on the spread_re/spread_im/inbuf register arrays
# ("$mem$...wr$...DATA is used but has no driver") plus informational "No latch
# inferred" lines. Yosys's authoritative `check` pass reports 0 problems and the
# design already passed the verify-agent yosys structural check, so these are safe.
QUIT_ON_SYNTH_CHECKS: false
QUIT_ON_LINTER_WARNINGS: false

# Power / ground nets.
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Signoff / streamout.
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Routing / ESD. DIODE_ON_PORTS is a direction (none|in|out|both), NOT a port name.
# RT_MAX_LAYER raised to Metal5 (vs the counter's Metal4): our larger clock tree
# hit DRT-0073 "no access point" on clkbuf input pins; an extra routing layer gives
# the detailed router more room to reach those pins. Drop back to Metal4 if needed.
DIODE_ON_PORTS: in
RT_MAX_LAYER: Metal5
PDN_MULTILAYER: false

# Power distribution network (straps + pitch) -- same as the proven counter run.
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_EXTEND_TO: boundary

# Placement. 40% target keeps cells spread for easy routing on a big die.
PL_TARGET_DENSITY_PCT: 40
MAX_FANOUT_CONSTRAINT: 10

# CTS defaults.
CTS_CLK_MAX_WIRE_LENGTH: 0
CTS_DISTANCE_BETWEEN_BUFFERS: 0
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 60

# Margins.
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 6
RIGHT_MARGIN_MULT: 6
